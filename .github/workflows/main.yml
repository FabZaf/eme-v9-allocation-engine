name: EME V9

on:
  workflow_dispatch:

jobs:
  run-v9:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. SCARICA IL REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. CONFIGURA PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. INSTALLA LE LIBRERIE
      # ======================================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. TEST DELLE REGOLE V9
      # ======================================================

      - name: Run V9 tests
        run: |
          python test_v9.py


      # ======================================================
      # 5. ESEGUI V9 OPERATIVO
      # ======================================================

      - name: Run V9
        run: |
          python main.py


      # ======================================================
      # 6. BACKTEST V9 ORIGINALE
      # ======================================================

      - name: Run V9 Backtest
        run: |
          python V9_BACKTEST.py


      # ======================================================
      # 7. BACKTEST V9 MENSILE
      # ======================================================

      - name: Run V9 Monthly Backtest
        run: |
          python V9_BACKTEST_MONTHLY.py


      # ======================================================
      # 8. STRESS TEST V9
      # ======================================================

      - name: Run V9 Stress Test
        run: |
          python V9_STRESS_TEST.py


      # ======================================================
      # 9. TEST EME ASSET × TIMEFRAME
      # ======================================================

      - name: Run EME Timeframe Test
        run: |
          python
