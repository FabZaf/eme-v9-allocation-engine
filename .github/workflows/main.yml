name: EME V9

on:
  workflow_dispatch:

jobs:
  run-v9:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. SCARICA IL REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. CONFIGURA PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. INSTALLA LE LIBRERIE
      # ======================================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # 4. TEST DELLE REGOLE V9
      # ======================================================

      - name: Run V9 tests
        run: |
          python test_v9.py


      # ======================================================
      # 5. ESEGUI V9 OPERATIVO
      # ======================================================

      - name: Run V9
        run: |
          python main.py


      # ======================================================
      # 6. BACKTEST V9 ORIGINALE
      # ======================================================

      - name: Run V9 Backtest
        run: |
          python V9_BACKTEST.py


      # ======================================================
      # 7. BACKTEST V9 MENSILE
      # ======================================================

      - name: Run V9 Monthly Backtest
        run: |
          python V9_BACKTEST_MONTHLY.py


      # ======================================================
      # 8. STRESS TEST V9
      # ======================================================

      - name: Run V9 Stress Test
        run: |
          python V9_STRESS_TEST.py


      # ======================================================
      # 9. TEST EME ASSET × TIMEFRAME
      # ======================================================

      - name: Run EME Timeframe Test
        run: |
          python EME_TIMEFRAME_TEST.py


      # ======================================================
      # 10. MOSTRA I RISULTATI NEL LOG
      # ======================================================

      - name: Show EME Timeframe Results
        run: |
          echo "===== TIMEFRAME RESULTS ====="
          cat eme_timeframe_results.csv
          echo "===== TIMEFRAME TRADES ====="
          cat eme_timeframe_trades.csv


      # ======================================================
      # 11. TEST ROBUSTEZZA EME
      # ======================================================

      - name: Run EME Robustness Test
        run: |
          python EME_ROBUSTNESS_TEST.py


      # ======================================================
      # 12. MOSTRA RISULTATI ROBUSTEZZA
      # ======================================================

      - name: Show EME Robustness Results
        run: |
          echo "===== EME ROBUSTNESS RESULTS ====="
          cat eme_robustness_results.csv


      # ======================================================
      # 13. EME ETF CHANGE ALERT
      # ======================================================

      - name: Run EME ETF Alert
        run: |
          python EME_ETF_ALERT.py


      # ======================================================
      # 14. MOSTRA ETF ALERT
      # ======================================================

      - name: Show EME ETF Alert
        run: |
          echo "===== EME ETF ALERT ====="
          cat eme_etf_alert.csv


      # ======================================================
      # 15. SALVA TUTTI I RISULTATI
      # ======================================================

      - name: Upload V9 outputs
        uses: actions/upload-artifact@v4
        with:
          name: v9-results
          path: |
            eme_v9_decisions.csv
            eme_v9_backtest_results.csv
            eme_v9_backtest_decisions.csv
            eme_v9_monthly_results.csv
            eme_v9_monthly_decisions.csv
            eme_v9_stress_test.csv
            eme_timeframe_results.csv
            eme_timeframe_trades.csv
            eme_robustness_results.csv
            eme_etf_alert.csv
